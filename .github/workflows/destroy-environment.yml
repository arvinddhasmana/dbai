name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
        default: dev
      confirm_destroy:
        description: Type DESTROY to confirm deletion of the selected environment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: dbai-destroy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy Azure Databricks environment
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DBAI_ENVIRONMENT: ${{ inputs.environment }}
      DBAI_RESOURCE_GROUP: ${{ vars.DBAI_RESOURCE_GROUP }}
      DBAI_MANAGED_RESOURCE_GROUP: ${{ vars.DBAI_MANAGED_RESOURCE_GROUP }}
      DBAI_WORKSPACE_NAME: ${{ vars.DBAI_WORKSPACE_NAME }}
      DBAI_CATALOG: ${{ vars.DBAI_CATALOG }}
      AI_SEARCH_ENDPOINT: ${{ vars.AI_SEARCH_ENDPOINT || 'globalmart-supply-chain-search' }}
      DBAI_BUNDLE_TARGET: ${{ inputs.environment }}
      DBAI_AUTH_MODE: azure-cli
      DATABRICKS_AUTH_TYPE: azure-cli

    steps:
      - name: Verify destroy confirmation
        if: ${{ inputs.confirm_destroy != 'DESTROY' }}
        run: |
          echo 'The confirm_destroy input must be exactly DESTROY.' >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate destroy configuration
        run: |
          test -n "$AZURE_SUBSCRIPTION_ID" || {
            echo 'AZURE_SUBSCRIPTION_ID is not configured for this GitHub Environment.' >&2
            exit 1
          }
          test -n "$DBAI_CATALOG" || {
            echo 'DBAI_CATALOG is not configured for this GitHub Environment.' >&2
            exit 1
          }

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Install Azure Databricks CLI extension
        run: az extension add --name databricks --only-show-errors

      - name: Resolve workspace URL
        shell: bash
        run: |
          workspace_url="$(az databricks workspace show \
            --resource-group "$DBAI_RESOURCE_GROUP" \
            --name "$DBAI_WORKSPACE_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query workspaceUrl \
            --output tsv)"
          echo "DATABRICKS_HOST=https://${workspace_url#https://}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Destroy environment
        run: scripts/local/destroy_demo_environment.sh --yes