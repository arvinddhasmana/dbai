bundle:
  name: agent-supply-chain-contract-ka
  engine: direct

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - static/**
    - pyproject.toml
    - app.yaml
  exclude:
    - .databricks/**
    - README.md
    - databricks.yml
    - resources/**
    - tests/**
    - '**/__pycache__/**'
    - '**/*.pyc'

targets:
  dev:
    mode: development
    default: true
  test:
    mode: production
  prod:
    mode: production
    resources:
      apps:
        supply_chain_contract_agent:
          name: agent-supply-chain-contract-ka
