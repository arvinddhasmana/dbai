[project]
name = "globalmart-contract-agent"
version = "0.1.0"
description = "Vector-search-only Databricks App agent for GlobalMart vendor contracts"
requires-python = ">=3.11"
dependencies = [
    "databricks-agents>=1.9.3",
    "databricks-openai>=0.13.0",
    "databricks-sdk>=0.60.0",
    "fastapi>=0.129.0",
    "mlflow>=3.10.0",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_server"]

[project.scripts]
start-server = "agent_server.start_server:main"
