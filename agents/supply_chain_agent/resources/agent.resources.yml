variables:
  catalog:
    description: Unity Catalog catalog used by this agent.
    default: dbai_demo
  ai_search_endpoint:
    description: AI Search endpoint used by contract retrieval.
    default: globalmart-supply-chain-search
  model_endpoint:
    description: Foundation model endpoint used by this agent.
    default: databricks-llama-4-maverick
  mlflow_experiment_name:
    description: MLflow experiment used for agent traces and evaluation runs.
    default: /Shared/globalmart-supply-chain-agent-uc-v2-dev
  mlflow_trace_catalog:
    description: Unity Catalog catalog used for MLflow trace tables.
    default: globalmart
  mlflow_trace_schema:
    description: Unity Catalog schema used for MLflow trace tables.
    default: agent_observability
  mlflow_trace_table_prefix:
    description: Prefix for MLflow trace tables in the trace schema.
    default: contract_agent_traces
  sql_warehouse_id:
    description: SQL warehouse used by the governed retrieval function.
    default: ""

resources:
  apps:
    supply_chain_contract_agent:
      name: dbai-supply-agent-${bundle.target}
      description: Vector-search-only GlobalMart contract agent.
      source_code_path: ..
      config:
        command: ["uv", "run", "start-server"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_REGISTRY_URI
            value: databricks-uc
          - name: MLFLOW_EXPERIMENT_NAME
            value: ${var.mlflow_experiment_name}
          - name: MLFLOW_TRACE_CATALOG
            value: ${var.mlflow_trace_catalog}
          - name: MLFLOW_TRACE_SCHEMA
            value: ${var.mlflow_trace_schema}
          - name: MLFLOW_TRACE_TABLE_PREFIX
            value: ${var.mlflow_trace_table_prefix}
          - name: MODEL_ENDPOINT
            value: ${var.model_endpoint}
          - name: DATABRICKS_SQL_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
          - name: DBAI_CATALOG
            value: ${var.catalog}
      user_api_scopes:
        - sql
        - model-serving
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
