# This is a Declarative Automation Bundle definition for dbai.
# The Databricks extension requires databricks.yml configuration file.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.

bundle:
  name: dbai
  engine: direct

include:
  - resources/*.yml

sync:
  include:
    - scripts/deployable/**
  exclude:
    - .azure/**
    - .databricks/**
    - .dbai-state/**
    - .env.example
    - .env
    - .github/**
    - .git/**
    - .vscode/**
    - .venv/**
    - .pytest_cache/**
    - agents/**
    - app/**
    - common_utils/**
    - docs/**
    - infra/**
    - requirements-dev.txt
    - sample_data/**
    - tests/**
    - sql/**
    - .gitignore
    - README.md
    - databricks.yml
    - resources/**
    - scripts/local/**
    - '**/__pycache__/**'
    - '**/*.pyc'

targets:
  dev:
    mode: development
    default: true

  test:
    mode: production

  prod:
    mode: production
